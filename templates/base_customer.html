<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Car Rental</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="phone">
  {% block header_wrap %}<header class="phone-header">{% block header %}{% endblock %}</header>{% endblock %}
  <main class="phone-body">
    {% include "_flash.html" %}
    {% block content %}{% endblock %}
  </main>
  {% if session.role == "customer" %}
  <nav class="tabbar">
    <a href="{{ url_for('search') }}" class="{{ 'active' if request.endpoint in ('search', 'vehicle') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</a>
    <a href="{{ url_for('my_rentals') }}" class="{{ 'active' if request.endpoint == 'my_rentals' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>My Rentals</a>
    <span title="Coming in a later sprint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"/></svg>Help</span>
    <a href="{{ url_for('logout') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Sign out</a>
  </nav>
  {% endif %}
</div>
</body>
</html>
