{% extends "base_staff.html" %}
{% block title %}Add vehicle{% endblock %}
{% block content %}
<div class="between"><h1>Add vehicle</h1><a href="{{ url_for('fleet') }}">← Back to fleet</a></div>
<div class="card" style="max-width:560px; margin-top:16px">
  <form method="post">
    {% include "_vehicle_fields.html" %}
    <p class="small muted">New vehicles set to <b>Active</b> appear in customer search straight away.</p>
    <button class="btn btn-primary">Add to fleet</button>
  </form>
</div>
{% endblock %}
